name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pip install poetry==2.5.1
      - run: poetry check --lock
      - run: poetry install --no-interaction
      # The same checks as locally. The tests of infra, consumer and bootstrap
      # run Postgres and RabbitMQ in containers, with the Docker of the runner.
      - run: poetry run task check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build .
