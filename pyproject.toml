[project]
name = "shortener"
version = "0.1.0"
description = ""
authors = [
    {name = "Rafael",email = "rafaelbltn1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.115.8,<0.116.0)",
    "python-slugify (>=8.0.4,<9.0.0)",
    "sqlalchemy (>=2.0.38,<3.0.0)",
    "alembic (>=1.14.1,<2.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "email-validator (>=2.2.0,<3.0.0)",
    "sendgrid (>=6.12.3,<7.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "babel (>=2.17.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
taskipy = "^1.14.1"
pytest-cov = "^6.0.0"
aiosqlite = "^0.21.0"
pytest-asyncio = "^0.25.3"

[tool.taskipy.tasks]
run = 'fastapi dev shortener/adapters/api/main.py'

test = 'pytest --cov=shortener -v'
test-domain = "pytest -v tests/test_domain/"
test-use-cases = "pytest -v tests/test_use_cases/"
test-adapters = "pytest -v tests/test_adapters/"
test-infra = "pytest -v tests/test_infra/"
test-fixtures = "pytest -v tests/test_fixtures/"
test-layers = 'task test-domain && task test-fixtures && task test-use-cases && task test-infra && task test-adapters'

i18n-extract = "pybabel extract -F babel.cfg -o shortener/infra/translations/messages.pot shortener/infra/templates"
i18n-init = "pybabel init -i messages.pot -d translations -l pt_BR"
i18n-update = "pybabel update -i shortener/infra/translations/messages.pot -d shortener/infra/translations"
i18n-compile = "pybabel compile -d shortener/infra/translations"
i18n-rebuild = "task i18n-extract && task i18n-update && task i18n-compile"
i18n-clean = "rm -f shortener/infra/translations/messages.pot"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
