[project]
name = "shortener"
version = "0.1.0"
description = ""
authors = [
    {name = "Rafael",email = "rafaelbltn1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.115.8,<0.116.0)",
    "sqlalchemy (>=2.0.38,<3.0.0)",
    "alembic (>=1.14.1,<2.0.0)",
    "pyjwt[crypto] (>=2.10.1,<3.0.0)",
    "uuid6 (>=2025.0.1,<2026.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
taskipy = "^1.14.1"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.25.3"
testcontainers = "^4.15.0"

[tool.taskipy.tasks]
run = 'fastapi dev shortener/adapters/api/main.py'

test = 'pytest --cov=shortener -v'
test_shared = "pytest -v tests/test_shared/"
test_domain = "pytest -v tests/test_domain/"
test_use_cases = "pytest -v tests/test_use_cases/"
test_api = "pytest -v tests/test_api/"
test_infra = "pytest -v tests/test_infra/"
test_bootstrap = "pytest -v tests/test_bootstrap/"
test_layers = 'task test_shared && task test_domain && task test_use_cases && task test_api && task test_infra && task test_bootstrap'

alembic_upgrade = "alembic upgrade +1"
alembic_downgrade = "alembic downgrade -1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
