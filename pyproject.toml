[project]
name = "shortener"
version = "0.1.0"
description = ""
authors = [
    {name = "Rafael",email = "rafaelbltn1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.115.8,<0.116.0)",
    "python-slugify (>=8.0.4,<9.0.0)",
    "sqlalchemy (>=2.0.38,<3.0.0)",
    "alembic (>=1.14.1,<2.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "email-validator (>=2.2.0,<3.0.0)",
    "sendgrid (>=6.12.3,<7.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "babel (>=2.17.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
taskipy = "^1.14.1"
pytest-cov = "^6.0.0"
aiosqlite = "^0.21.0"
pytest-asyncio = "^0.25.3"

[tool.taskipy.tasks]
run = 'fastapi dev shortener/adapters/api/main.py'
test = 'pytest --cov=shortener -v'
test-domain = "pytest -v tests/test_domain/"
test-adapters = "pytest -v tests/test_adapters/"
test-infra = "pytest -v tests/test_infra/"
test-layers = 'pytest -v tests/test_domain/ && pytest -v tests/test_fixtures/ && pytest -v tests/test_use_cases/ && pytest -v tests/test_infra/ && pytest -v tests/test_adapters/'

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
