[project]
name = "shortener"
version = "0.1.0"
description = ""
authors = [
    {name = "Rafael",email = "rafinha.b.lucena@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.115.8,<0.116.0)",
    "python-slugify (>=8.0.4,<9.0.0)",
    "sqlalchemy (>=2.0.38,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
taskipy = "^1.14.1"
pytest-cov = "^6.0.0"

[tool.taskipy.tasks]
run = 'fastapi dev shortener/main.py'
test = 'pytest -s -x --cov=shortener -vv'
