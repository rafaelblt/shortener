[project]
name = "shortener"
version = "0.1.0"
description = ""
authors = [
    {name = "Rafael",email = "rafaelbltn1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.115.8,<0.116.0)",
    "sqlalchemy (>=2.0.38,<3.0.0)",
    "alembic (>=1.14.1,<2.0.0)",
    "pyjwt[crypto] (>=2.10.1,<3.0.0)",
    "uuid6 (>=2025.0.1,<2026.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "aio-pika (>=10.1.1,<11.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
taskipy = "^1.14.1"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.25.3"
testcontainers = "^4.15.0"
pyyaml = "^6.0.2"
ruff = "^0.17.1"
mypy = "^2.4.0"
import-linter = "^2.15"
types-pyyaml = "^6.0.12"

[tool.taskipy.tasks]
run = "uvicorn shortener.bootstrap.app:create_app --factory --reload"
consume = "python -m shortener.bootstrap.consumer"

check = "task lint && task typecheck && task imports && task test"
lint = "ruff check && ruff format --check"
format = "ruff check --fix-only && ruff format"
typecheck = "mypy"
imports = "lint-imports"
test = "pytest --cov=shortener"
test_shared = "pytest -v tests/test_shared/"
test_domain = "pytest -v tests/test_domain/"
test_use_cases = "pytest -v tests/test_use_cases/"
test_api = "pytest -v tests/test_api/"
test_consumer = "pytest -v tests/test_consumer/"
test_infra = "pytest -v tests/test_infra/"
test_bootstrap = "pytest -v tests/test_bootstrap/"

openapi = "python -m tests.utils.openapi_helpers"

alembic_upgrade = "alembic upgrade +1"
alembic_downgrade = "alembic downgrade -1"

[tool.ruff]
line-length = 88
extend-exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes: unused imports and variables, undefined names
    "E",      # pycodestyle errors, such as lines longer than line-length
    "W",      # pycodestyle warnings, such as trailing whitespace
    "I",      # isort: the order of the imports
    "UP",     # pyupgrade: the syntax of the Python of requires-python
    "B",      # flake8-bugbear: likely bugs
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie: unnecessary code
    "RUF",    # Ruff's own rules
    "ASYNC",  # flake8-async: blocking calls in async code
    "PT",     # flake8-pytest-style
    "N",      # pep8-naming
    "TID",    # flake8-tidy-imports: absolute imports only
    "DTZ",    # flake8-datetimez: no naive datetimes
    "PGH",    # pygrep-hooks: no type: ignore or noqa without a code
    "G",      # flake8-logging-format
    "LOG",    # flake8-logging
    "T20",    # flake8-print: no print()
    "PLE",    # Pylint errors
    "PLW",    # Pylint warnings
    "SLF",    # flake8-self: no private member of another object
]
ignore = [
    # The tests check what the message of an exception names with
    # assert_mentions, and not with match.
    "PT011",
]

[tool.ruff.lint.per-file-ignores]
# The tests poll what is outside the process, such as a queue, until it
# changes.
"tests/**" = ["ASYNC110"]
# A conftest.py loads the fixtures of a layer with *.
"tests/**/conftest.py" = ["F401", "F403"]
"tests/fixtures/*/__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
# alembic/ holds the migrations, and isn't the package alembic.
known-third-party = ["alembic"]
lines-after-imports = 2
lines-between-types = 1

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.mypy]
files = ["shortener", "tests", "alembic"]
strict = true
enable_error_code = ["ignore-without-code", "possibly-undefined", "truthy-bool"]

[[tool.mypy.overrides]]
# The bodies of the tests are checked, but the tests need no type hints. They
# compare values of different types, and pass wrong ones, on purpose, and
# their doubles return Any.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
strict_equality = false
warn_return_any = false
disable_error_code = ["empty-body"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["shortener", "tests"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The layers depend inward"
type = "layers"
layers = [
    "shortener.bootstrap",
    "shortener.api | shortener.consumer | shortener.infra",
    "shortener.use_cases",
    "shortener.domain",
    "shortener.shared",
]

[[tool.importlinter.contracts]]
name = "The domain, the use cases and shared use no framework"
type = "forbidden"
source_modules = ["shortener.domain", "shortener.use_cases", "shortener.shared"]
forbidden_modules = [
    "aio_pika",
    "alembic",
    "asyncpg",
    "fastapi",
    "jwt",
    "pydantic",
    "sqlalchemy",
    "starlette",
]

[[tool.importlinter.contracts]]
name = "The entry points reach the database and the access tokens through abstractions"
type = "forbidden"
source_modules = ["shortener.api", "shortener.consumer"]
forbidden_modules = ["asyncpg", "jwt", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "The tests of shared import no layer"
type = "forbidden"
source_modules = ["tests.test_shared", "tests.fixtures.shared"]
forbidden_modules = [
    "shortener.domain",
    "shortener.use_cases",
    "shortener.api",
    "shortener.consumer",
    "shortener.infra",
    "shortener.bootstrap",
]

[[tool.importlinter.contracts]]
name = "The tests of the domain import no layer above it"
type = "forbidden"
source_modules = ["tests.test_domain", "tests.fixtures.domain"]
forbidden_modules = [
    "shortener.use_cases",
    "shortener.api",
    "shortener.consumer",
    "shortener.infra",
    "shortener.bootstrap",
]

[[tool.importlinter.contracts]]
name = "The tests of the use cases import no layer above them"
type = "forbidden"
source_modules = ["tests.test_use_cases", "tests.fixtures.use_cases"]
forbidden_modules = [
    "shortener.api",
    "shortener.consumer",
    "shortener.infra",
    "shortener.bootstrap",
]

[[tool.importlinter.contracts]]
name = "The tests of the API import neither its siblings nor bootstrap"
type = "forbidden"
source_modules = ["tests.test_api", "tests.fixtures.api"]
forbidden_modules = ["shortener.consumer", "shortener.infra", "shortener.bootstrap"]

[[tool.importlinter.contracts]]
name = "The tests of the consumer import neither its siblings nor bootstrap"
type = "forbidden"
source_modules = ["tests.test_consumer", "tests.fixtures.consumer"]
forbidden_modules = ["shortener.api", "shortener.infra", "shortener.bootstrap"]

[[tool.importlinter.contracts]]
name = "The tests of infra import neither its siblings nor bootstrap"
type = "forbidden"
source_modules = ["tests.test_infra", "tests.fixtures.infra"]
forbidden_modules = ["shortener.api", "shortener.consumer", "shortener.bootstrap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # The Docker client of testcontainers leaves its sockets to the garbage
    # collector.
    "ignore:Exception ignored in. <socket.socket fd=-1, family=1:pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    # The bodies of the methods of a Protocol, which never run.
    '^\s*\.\.\.$',
    ': \.\.\.$',
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]
