        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
  /v1/shorturls/{id}/disable:
    post:
      tags:
      - Short URLs
      summary: Disable a short URL
      operationId: DisableShortURL
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortURLDetails'
        '401':
          description: '`not_authenticated`: The request needs a valid access token.'
          headers:
            WWW-Authenticate:
              description: The scheme of the access token, Bearer.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '404':
          description: '`shorturl_not_found`: The short URL doesn''t exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '422':
          description: '`invalid_input`: Values of the request break their rules.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '429':
          description: '`too_many_requests`: The client made too many requests. Try
            again later.'
          headers:
            Retry-After:
              description: The seconds until the client can make requests again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
  /v1/health:
    get:
      tags:
      - Health
      summary: Check the health of the service
      operationId: CheckHealth
      responses:
        '204':
          description: No Content
        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
components:
  schemas:
    Body_CreateShortURL:
      properties:
        target_url:
          type: string
          title: Target Url
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
      type: object
      required:
      - target_url
      title: Body_CreateShortURL
    Body_UpdateShortURL:
      properties:
        target_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Url
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
      type: object
      title: Body_UpdateShortURL
    ErrorContent:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        fields:
          anyOf:
          - items:
              $ref: '#/components/schemas/FieldContent'
            type: array
          - type: 'null'
          title: Fields
      type: object
      required:
      - code
      - message
      title: ErrorContent
      description: The content of every error response.
    FieldContent:
      properties:
        field:
          type: string
          title: Field
        issues:
          items:
            $ref: '#/components/schemas/IssueContent'
          type: array
          title: Issues
      type: object
      required:
      - field
      - issues
      title: FieldContent
    IssueContent:
      properties:
        code:
          type: string
          title: Code
      type: object
      required:
      - code
      title: IssueContent
    ResolvedSlug:
      properties:
        target_url:
          type: string
          title: Target Url
      type: object
      required:
      - target_url
      title: ResolvedSlug
    ShortURLDetails:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        slug:
          type: string
          title: Slug
        target_url:
          type: string
          title: Target Url
        owner_id:
          type: string
          format: uuid
          title: Owner Id
        status:
          type: string
          title: Status
        resolution_count:
          type: integer
          title: Resolution Count
        created_at:
          type: string
          format: date-time
          title: Created At
        last_resolved_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Resolved At
      type: object
      required:
      - id
      - slug
      - target_url
      - owner_id
      - status
      - resolution_count
      - created_at
      - last_resolved_at
      title: ShortURLDetails
    ShortURLPageContent:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ShortURLDetails'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      - next_cursor
      title: ShortURLPageContent
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
