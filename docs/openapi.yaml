      summary: Getshorturl
      operationId: GetShortURL
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortURLDetails'
        '401':
          description: '`not_authenticated`: The request needs a valid access token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '404':
          description: '`shorturl_not_found`: The short URL doesn''t exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '422':
          description: '`invalid_input`: Values of the request break their rules.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '429':
          description: '`too_many_requests`: The client made too many requests. Try
            again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
    patch:
      summary: Updateshorturl
      operationId: UpdateShortURL
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_UpdateShortURL'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortURLDetails'
        '401':
          description: '`not_authenticated`: The request needs a valid access token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '422':
          description: '`nothing_to_update`: The request has no value to change. `invalid_input`:
            Values of the request break their rules.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '404':
          description: '`shorturl_not_found`: The short URL doesn''t exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '409':
          description: '`slug_taken`: Another short URL has the slug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '400':
          description: '`malformed_body`: The body isn''t valid JSON.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '429':
          description: '`too_many_requests`: The client made too many requests. Try
            again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
    delete:
      summary: Deleteshorturl
      operationId: DeleteShortURL
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: '`not_authenticated`: The request needs a valid access token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '404':
          description: '`shorturl_not_found`: The short URL doesn''t exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '422':
          description: '`invalid_input`: Values of the request break their rules.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '429':
          description: '`too_many_requests`: The client made too many requests. Try
            again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
  /v1/shorturls/{id}/enable:
    post:
      summary: Enableshorturl
      operationId: EnableShortURL
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
