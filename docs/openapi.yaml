  /v1/shorturls/{id}/disable:
    post:
      summary: Disableshorturl
      operationId: DisableShortURL
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
