openapi: 3.1.0
info:
  title: Shortener
  version: 0.1.0
paths:
  /v1/slugs/{slug}:
    get:
      summary: Resolveslug
      operationId: ResolveSlug
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedSlug'
        '404':
          description: '`shorturl_not_found`: The short URL doesn''t exist. `shorturl_deactivated`:
            The short URL is deactivated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '422':
          description: '`invalid_input`: Values of the request break their rules.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '429':
          description: '`too_many_requests`: The client made too many requests. Try
            again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
  /v1/slugs/{slug}/redirect:
    get:
      summary: Redirectslug
      operationId: RedirectSlug
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '307':
          description: Successful Response
        '404':
          description: '`shorturl_not_found`: The short URL doesn''t exist. `shorturl_deactivated`:
            The short URL is deactivated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '422':
          description: '`invalid_input`: Values of the request break their rules.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '429':
          description: '`too_many_requests`: The client made too many requests. Try
            again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
  /v1/shorturls:
    post:
      summary: Createshorturl
      operationId: CreateShortURL
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_CreateShortURL'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortURLDetails'
        '401':
          description: '`not_authenticated`: The request needs a valid access token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '422':
          description: '`invalid_input`: Values of the request break their rules.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '409':
          description: '`slug_taken`: Another short URL has the slug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '400':
          description: '`malformed_body`: The body isn''t valid JSON.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '429':
          description: '`too_many_requests`: The client made too many requests. Try
            again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
    get:
      summary: Listshorturls
      operationId: ListShortURLs
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortURLPageContent'
        '401':
          description: '`not_authenticated`: The request needs a valid access token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '422':
          description: '`invalid_input`: Values of the request break their rules.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '429':
          description: '`too_many_requests`: The client made too many requests. Try
            again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
