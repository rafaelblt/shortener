openapi: 3.1.0
info:
  title: Shortener
  version: 0.1.0
paths:
  /v1/slugs/{slug}:
    get:
      tags:
      - Slugs
      summary: Resolve a slug
      operationId: ResolveSlug
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedSlug'
        '404':
          description: '`shorturl_not_found`: The short URL doesn''t exist. `shorturl_deactivated`:
            The short URL is deactivated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '422':
          description: '`invalid_input`: Values of the request break their rules.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '429':
          description: '`too_many_requests`: The client made too many requests. Try
            again later.'
          headers:
            Retry-After:
              description: The seconds until the client can make requests again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
  /v1/slugs/{slug}/redirect:
    get:
      tags:
      - Slugs
      summary: Redirect to the target URL of a slug
      operationId: RedirectSlug
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      responses:
        '307':
          description: Temporary Redirect
          headers:
            Location:
              description: The URL the request is redirected to.
              schema:
                type: string
        '404':
          description: '`shorturl_not_found`: The short URL doesn''t exist. `shorturl_deactivated`:
            The short URL is deactivated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '422':
          description: '`invalid_input`: Values of the request break their rules.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '429':
          description: '`too_many_requests`: The client made too many requests. Try
            again later.'
          headers:
            Retry-After:
              description: The seconds until the client can make requests again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
  /v1/shorturls:
    post:
      tags:
      - Short URLs
      summary: Create a short URL
      operationId: CreateShortURL
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_CreateShortURL'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortURLDetails'
          headers:
            Location:
              description: The URL of what the request created.
              schema:
                type: string
        '401':
          description: '`not_authenticated`: The request needs a valid access token.'
          headers:
            WWW-Authenticate:
              description: The scheme of the access token, Bearer.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '422':
          description: '`invalid_input`: Values of the request break their rules.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '409':
          description: '`slug_taken`: Another short URL has the slug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '400':
          description: '`malformed_body`: The body isn''t valid JSON.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '429':
          description: '`too_many_requests`: The client made too many requests. Try
            again later.'
          headers:
            Retry-After:
              description: The seconds until the client can make requests again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
    get:
      tags:
      - Short URLs
      summary: List the short URLs of the user
      operationId: ListShortURLs
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortURLPageContent'
        '401':
          description: '`not_authenticated`: The request needs a valid access token.'
          headers:
            WWW-Authenticate:
              description: The scheme of the access token, Bearer.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '422':
          description: '`invalid_input`: Values of the request break their rules.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '429':
          description: '`too_many_requests`: The client made too many requests. Try
            again later.'
          headers:
            Retry-After:
              description: The seconds until the client can make requests again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
  /v1/shorturls/{id}:
    get:
      tags:
      - Short URLs
      summary: Get a short URL
      operationId: GetShortURL
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortURLDetails'
        '401':
          description: '`not_authenticated`: The request needs a valid access token.'
          headers:
            WWW-Authenticate:
              description: The scheme of the access token, Bearer.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '404':
          description: '`shorturl_not_found`: The short URL doesn''t exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '422':
          description: '`invalid_input`: Values of the request break their rules.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '429':
          description: '`too_many_requests`: The client made too many requests. Try
            again later.'
          headers:
            Retry-After:
              description: The seconds until the client can make requests again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
    patch:
      tags:
      - Short URLs
      summary: Update a short URL
      operationId: UpdateShortURL
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_UpdateShortURL'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortURLDetails'
        '401':
          description: '`not_authenticated`: The request needs a valid access token.'
          headers:
            WWW-Authenticate:
              description: The scheme of the access token, Bearer.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '422':
          description: '`nothing_to_update`: The request has no value to change. `invalid_input`:
            Values of the request break their rules.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '404':
          description: '`shorturl_not_found`: The short URL doesn''t exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '409':
          description: '`slug_taken`: Another short URL has the slug.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '400':
          description: '`malformed_body`: The body isn''t valid JSON.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '429':
          description: '`too_many_requests`: The client made too many requests. Try
            again later.'
          headers:
            Retry-After:
              description: The seconds until the client can make requests again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
    delete:
      tags:
      - Short URLs
      summary: Delete a short URL
      operationId: DeleteShortURL
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '204':
          description: No Content
        '401':
          description: '`not_authenticated`: The request needs a valid access token.'
          headers:
            WWW-Authenticate:
              description: The scheme of the access token, Bearer.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '404':
          description: '`shorturl_not_found`: The short URL doesn''t exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '422':
          description: '`invalid_input`: Values of the request break their rules.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '429':
          description: '`too_many_requests`: The client made too many requests. Try
            again later.'
          headers:
            Retry-After:
              description: The seconds until the client can make requests again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
        '503':
          description: '`unavailable`: The service can''t answer now. Try again later.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContent'
  /v1/shorturls/{id}/enable:
    post:
      tags:
      - Short URLs
      summary: Enable a short URL
      operationId: EnableShortURL
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Id
      responses:
        '200':
          description: OK
          content:
